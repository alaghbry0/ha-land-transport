# ─────────────────────────────────────────────────────────────────────────────
# android-apk.yml — بناء APK لـ «HA للنقل البري»
#
# مستوحى من سير البناء الناضج في simple-invoice-manager (نفس بيئة التطوير):
#   - gates (analyze) ثم build (matrix arm64 + universal) متوازية
#   - versionCode = run_number (متصاعد حصراً)
#   - وسم v* = بناء APK + نشر GitHub Release (تنزيل مباشر من الهاتف)
#   - تشغيل يدوي = arm64 حصراً (تدفئة الكاش)
#   - دفع main = بوابات فقط بلا بناء (توفير ميزانية Actions)
# ─────────────────────────────────────────────────────────────────────────────
name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: 'ابنِ الحزمة الشاملة (universal) أيضاً'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # ── البوابات: analyze صفر مشاكل ──────────────────────────────────────────
  gates:
    name: بوابات الجودة (flutter analyze)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (كاش SDK + pub)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (صفر مطلق)
        run: flutter analyze

  # ── البناء: matrix متوازية — arm64 للهواتف الحديثة + الشاملة ────────────
  build:
    name: بناء APK (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.build_all) && '["universal", "arm64"]' || '["arm64"]') }}
        include:
          - target: universal
            flags: ''
            suffix: ''
          - target: arm64
            flags: '--target-platform android-arm64'
            suffix: '-arm64'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up JDK 17 (كاش Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (كاش SDK + pub)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK (${{ matrix.target }})
        run: flutter build apk --release ${{ matrix.flags }} --build-number=${{ github.run_number }}

      - name: Stage APK
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d '+' -f 1 | tr -d '[:space:]')"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/ha-transport-v${VERSION}${{ matrix.suffix }}.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target }}-r${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

  # ── النشر: GitHub Release بالـ APK عند الوسم ─────────────────────────────
  release:
    name: نشر GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*-r${{ github.run_number }}
          merge-multiple: true
          path: out

      - name: Create GitHub Release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## HA للنقل البري — نسخة أندرويد

          بناء تلقائي من الفرع الرئيسي عبر GitHub Actions.

          ### أي ملف تنزّل؟
          - **`-arm64` (الأصغر — لِهاتفك)** — لهواتف أندرويد الحديثة (2018 فصاعداً): **نزّل هذا**.
          - **الحزمة الشاملة (بلا لاحقة)** — تعمل على أي جهاز أندرويد، أكبر حجماً.

          ### التثبيت
          1. نزّل ملف APK من الأسفل.
          2. افتحه من شريط التنزيلات أو تطبيق «الملفات».
          3. اسمح بـ«التثبيت من مصادر غير معروفة» عند طلب النظام.
          4. ثبّت وافتح «HA للنقل البري».

          ### ملاحظات
          - التطبيق يحتاج اتصالاً بالإنترنت لجلب بلاطات خريطة OpenStreetMap.
          - نموذج أولي تفاعلي: بيانات وهمية محلية بالكامل (لا خادم خلفي).
          NOTES
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" out/*.apk --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" out/*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "HA للنقل البري ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
