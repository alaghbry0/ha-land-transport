name: ha_land_transport
description: "HA للنقل البري — نموذج أولي تفاعلي لتطبيق نقل بري محلي في السعودية (راكب/كابتن) بواجهة عربية RTL وخريطة OSM، مبني على قالب flutter-sandbox-template."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Cairo — Arabic UI font (bundled as font assets, not a pub package;
  # the zero-third-party-runtime-dependency promise still holds).
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/google_fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
